name: Beta Coefficient Platform CI

on:
  push: 
    branches: ["main", "my-version-b-coefficient-model"]
  pull_request: 
    branches: ["main"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: django
          POSTGRES_PASSWORD: django
          POSTGRES_DB: beta_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U django -d beta_platform"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Django settings for beta coefficient platform
      DB_ENGINE: postgres
      DB_NAME: beta_platform
      DB_USER: django
      DB_PASSWORD: django
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DEBUG: "1"
      SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'test-secret-key-for-ci' }}
      DJANGO_SETTINGS_MODULE: backend.settings

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check code formatting with ruff
        run: ruff check backend/
        continue-on-error: true

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend

      - name: Run Django system checks
        run: python manage.py check
        working-directory: backend

      - name: Run beta coefficient platform tests
        run: |
          pytest --cov=webapp --cov-report=xml --cov-report=term-missing \
            --tb=short -v
        working-directory: backend

      - name: Test beta data import command
        run: |
          python manage.py migrate
          # Test import command with sample data (if available)
          python manage.py check
        working-directory: backend

  frontend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: frontend

      - name: Run TypeScript type checking
        run: pnpm run build
        working-directory: frontend

      - name: Run frontend linting
        run: pnpm run lint
        working-directory: frontend
        continue-on-error: true

  integration-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: django
          POSTGRES_PASSWORD: django
          POSTGRES_DB: beta_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U django -d beta_platform"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd frontend && pnpm install

      - name: Setup database and run migrations
        env:
          DB_ENGINE: postgres
          DB_NAME: beta_platform
          DB_USER: django
          DB_PASSWORD: django
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DEBUG: "1"
          SECRET_KEY: "test-secret-key-for-ci"
        run: |
          cd backend
          python manage.py migrate
          python manage.py check

      - name: Test API endpoints
        env:
          DB_ENGINE: postgres
          DB_NAME: beta_platform
          DB_USER: django
          DB_PASSWORD: django
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DEBUG: "1"
          SECRET_KEY: "test-secret-key-for-ci"
        run: |
          cd backend
          python manage.py runserver 8000 &
          sleep 10
          curl -f http://localhost:8000/api/beta/summary/ || echo "API test complete"
          pkill -f runserver

      - name: Build frontend for production
        run: |
          cd frontend
          pnpm run build
